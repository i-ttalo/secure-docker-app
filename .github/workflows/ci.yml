
name: Secure App CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests & Code Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
          python -m pip install ruff==0.17.1
          python -m pip install bandit==1.9.4
          python -m pip install pip-audit==2.10.1

      - name: Run tests
        run: python -m pytest -v

      - name: Run Ruff
        run: python -m ruff check backend/

      - name: Run Bandit Security Scan
        run: python -m bandit -r backend/ -x backend/test_app.py

      - name: Audit Python Dependencies
        run: python -m pip_audit -r backend/requirements.txt

  container-security:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t secure-app-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t secure-app-frontend:ci ./frontend

      - name: Trivy scan - Backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-app-backend:ci
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy scan - Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secure-app-frontend:ci
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"