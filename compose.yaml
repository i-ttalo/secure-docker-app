
services:
  frontend:
    build:
      context: ./frontend

    container_name: secure_frontend

    ports:
      - "8080:80"

    networks:
      - frontend-network

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend

    container_name: secure_backend

    depends_on:
      database:
        condition: service_healthy

    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: secureapp
      DB_USER: appuser

    secrets:
      - db_password

    networks:
      - frontend-network
      - backend-network

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    cpus: 0.50
    mem_limit: 256m

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:5000/health
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  database:
    image: postgres:18-alpine


    container_name: secure_database

    environment:
      POSTGRES_DB: secureapp
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - postgres-data:/var/lib/postgresql

    networks:
      - backend-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d secureapp"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge

volumes:
  postgres-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt