limit_req_zone $binary_remote_addr zone=db_health_limit:10m rate=5r/s;

server {
    listen 80;

    limit_req_status 429;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location = /api/db-health {
        limit_req zone=db_health_limit burst=5 nodelay;
        proxy_pass http://backend:5000/db-health;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
    }
}